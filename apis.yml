name: Ahlijasa
description: Ahlijasa was an Indonesian on-demand home services startup founded in 2015
  in the Greater Jakarta area by Jay Jayawijayaningtiyas and Made Dimas Astra Wijaya. It
  originally offered laundry, air-conditioning repair, and home cleaning before pivoting in
  late 2016 to focus exclusively on on-demand laundry by partnering with premium and
  traditional laundrettes to give them a digital storefront and online customer base. The
  company won Startup World Cup Indonesia in 2016 and raised seed funding in May 2017 from
  500 Startups (500 Global), Fenox VC, and Indogen Capital, but secured no further funding
  afterward. Its primary domain (ahlijasa.com) now resolves to a domain-parking/for-sale
  page, indicating the business is no longer operating. No public API, developer portal, or
  machine-readable API artifacts were found for this provider during enrichment.
